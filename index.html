<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trova Aziende - Prototipo</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="app-container">
        
        <div id="sidebar">
            <h4 class="brand-title">📍 B2B Locator</h4>
            
            <div class="mb-3">
                <label for="addressInput" class="form-label">Punto di partenza (Indirizzo)</label>
                <input type="text" class="form-control" id="addressInput" placeholder="Es: Via Roma, Milano">
            </div>

            <div class="mb-3">
                <label for="radiusInput" class="form-label">Raggio di ricerca (km)</label>
                <select class="form-select" id="radiusInput">
                    <option value="1000">1 km</option>
                    <option value="5000" selected>5 km</option>
                    <option value="10000">10 km</option>
                    <option value="20000">20 km</option>
                </select>
            </div>

            <button class="btn btn-primary w-100 mb-2" id="searchBtn">Cerca Aziende</button>
            <button class="btn btn-outline-secondary w-100" id="myLocationBtn">Usa la mia posizione</button>

            <div id="results-list">
                <p class="text-muted small">I risultati appariranno qui...</p>
            </div>
        </div>

        <div id="map"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>
</body>
</html>
